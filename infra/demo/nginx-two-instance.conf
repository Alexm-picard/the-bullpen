# nginx reverse-proxy for the N1 two-instance api demo.
#
# Two api instances on ports 8080 + 8082, fronted by nginx on port 9101
# with ip_hash (IP-affinity) load balancing.
#
# Port 9101 chosen to avoid collisions: 9000 = ClickHouse native,
# 9100 = node-exporter, both present on the prod box.
#
# Usage (box-side, from /opt/bullpen):
#
#   # Instance A (the normal unit)
#   sudo systemctl start bullpen-api
#
#   # Instance B (one-off, CWD must be /opt/bullpen for PropertiesLauncher)
#   cd /opt/bullpen
#   sudo -u bullpen java -jar app.jar \
#     --spring.profiles.active=api \
#     --server.port=8082 &
#
#   # LB
#   sudo nginx -c $(pwd)/infra/demo/nginx-two-instance.conf
#
#   # Exercise
#   infra/demo/two-instance-exercise.sh
#
#   # Teardown
#   sudo nginx -s stop
#   kill %1

worker_processes 1;
error_log /tmp/bullpen-demo-nginx-error.log warn;
pid /tmp/bullpen-demo-nginx.pid;

events {
    worker_connections 64;
}

http {
    log_format uplog '$remote_addr - $upstream_addr [$time_local] '
                     '"$request" $status $body_bytes_sent';
    access_log /tmp/bullpen-demo-nginx-access.log uplog;

    upstream bullpen_api {
        ip_hash;
        server 127.0.0.1:8080;
        server 127.0.0.1:8082;
    }

    server {
        listen 9101;
        server_name localhost;

        location / {
            proxy_pass http://bullpen_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://bullpen_api/actuator/health;
            proxy_set_header Host $host;
        }
    }
}
