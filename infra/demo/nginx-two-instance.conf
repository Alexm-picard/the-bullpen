# nginx reverse-proxy for the N1 two-instance api demo.
#
# Two api instances on ports 8080 + 8082, fronted by nginx on port 9000
# with ip_hash (IP-affinity) load balancing. This proves the operational
# story: two stateless api replicas behind a real LB, with bounded
# routing-cache convergence (the ApiPairTwoInstanceIT property) exercised
# under real HTTP rather than in-process.
#
# Usage (box-side, after deploy.sh puts the JAR at /opt/bullpen/app.jar):
#
#   # Start instance A on :8080 (the normal bullpen-api unit)
#   sudo systemctl start bullpen-api
#
#   # Start instance B on :8082 (a one-off, not a permanent unit)
#   sudo -u bullpen java -jar /opt/bullpen/app.jar \
#     --spring.profiles.active=api \
#     --server.port=8082 \
#     --bullpen.registry.db=/opt/bullpen/data/registry.sqlite \
#     --bullpen.registry.contractsdir=/opt/bullpen/contracts \
#     --bullpen.clickhouse.enabled=true &
#
#   # Start the LB
#   sudo nginx -c $(pwd)/infra/demo/nginx-two-instance.conf
#
#   # Exercise
#   infra/demo/two-instance-exercise.sh
#
#   # Teardown
#   sudo nginx -s stop
#   kill %1  # the background instance B

worker_processes 1;
error_log /tmp/bullpen-demo-nginx-error.log warn;
pid /tmp/bullpen-demo-nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log /tmp/bullpen-demo-nginx-access.log;

    upstream bullpen_api {
        ip_hash;
        server 127.0.0.1:8080;
        server 127.0.0.1:8082;
    }

    server {
        listen 9000;
        server_name localhost;

        location / {
            proxy_pass http://bullpen_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://bullpen_api/actuator/health;
        }
    }
}
